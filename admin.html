<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://dvkxpkxvknfxyefoqlfp.supabase.co; connect-src 'self' data: https://dvkxpkxvknfxyefoqlfp.supabase.co wss://dvkxpkxvknfxyefoqlfp.supabase.co; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>FlowyMarket Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=DM+Sans:wght@400;600;700&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f8fa; --surface:#ffffff; --surface-2:#f1f5f7; --border:#e2e8ec; --text:#1f2a33; --muted:#66737d;
  --accent:#0e8aa8; --accent-ink:#ffffff; --accent-soft:#e3f4f8; --danger:#d4455a; --ok:#1e9e62; --warn:#c98a10;
  --shadow:0 1px 2px rgba(15,30,40,.06),0 4px 16px rgba(15,30,40,.05); --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --surface:#172026; --surface-2:#1d2830; --border:#2a3740; --text:#e6edf1; --muted:#93a2ac;
    --accent:#29b3d4; --accent-ink:#06222b; --accent-soft:#143440; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172026; --surface-2:#1d2830; --border:#2a3740; --text:#e6edf1; --muted:#93a2ac;
  --accent:#29b3d4; --accent-ink:#06222b; --accent-soft:#143440; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.banner{background:var(--accent-soft);color:var(--text);display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:13px}
.banner b{margin-left:auto}
.app{display:flex;min-height:calc(100vh - 36px)}
.side{width:230px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 36px)}
.side .store{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border-bottom:1px solid var(--border)}
.logo{width:72px;height:72px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;font-size:26px;color:var(--accent);overflow:hidden;box-shadow:var(--shadow)}
.logo img{width:100%;height:100%;object-fit:cover}
.side nav{padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.side nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--text)}
.side nav button:hover{background:var(--surface-2)}
.side nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
main{flex:1;min-width:0;padding:28px 32px 60px}
h1{font-size:24px;margin:0 0 18px}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.icon{padding:6px 8px}
label.f{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
input[type=text],input[type=number],input[type=url],input[type=email],input[type=tel],input[type=date],input[type=search],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chk{display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--border);border-radius:22px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(16px)}
.setting{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border)}
.setting:last-child{border-bottom:0}
.setting .t{flex:1}
.setting .t b{display:block}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr.drag-over td{border-top:2px solid var(--accent)}
.thumb{width:40px;height:40px;border-radius:8px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.off{color:var(--muted);border-color:var(--border)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--danger);border-color:var(--danger)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.stat small{color:var(--muted)}
.stat div{font-size:22px;font-weight:700;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.drag{cursor:grab;color:var(--muted);user-select:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,20,25,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal.open{display:flex}
.modal .box{background:var(--surface);border-radius:14px;max-width:760px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .box header{display:flex;align-items:center;margin-bottom:12px}
.modal .box header h2{margin:0;flex:1}
.blocklib{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.blocklib button{text-align:left;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer}
.blocklib button:hover{border-color:var(--accent)}
.blocklib b{display:block;margin-bottom:4px}
.blocklib span{font-size:12px;color:var(--muted)}
/* editor de diseño */
.designer{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
.blocks .blk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.blocks .blk.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.blocks .blk .n{flex:1}
.blocks .blk.drag-over{border-top:3px solid var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatches button{border:2px solid var(--border);border-radius:10px;padding:8px 4px;background:var(--surface);cursor:pointer;font-size:12px}
.swatches button.on{border-color:var(--accent)}
.swatches i{display:block;height:26px;border-radius:6px;margin-bottom:5px}
.fonts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fonts button{border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--surface);cursor:pointer;text-align:left}
.fonts button.on{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.stage{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:380px;max-width:100%;height:720px;border:10px solid #1b232a;border-radius:38px;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.phone.desk{width:100%;border-radius:14px;border-width:6px}
.phone iframe{width:100%;height:100%;border:0;display:block}
.prodform{display:grid;grid-template-columns:220px 1fr;gap:24px}
.imgdrop{width:200px;height:200px;border:2px dashed var(--border);border-radius:14px;display:grid;place-items:center;background:var(--surface-2);overflow:hidden;cursor:pointer;color:var(--muted);text-align:center}
.imgdrop img{width:100%;height:100%;object-fit:cover}
.optcat{border:1px solid var(--border);border-radius:10px;padding:14px;margin:12px 0;background:var(--surface-2)}
.optitem{display:grid;grid-template-columns:1fr 130px auto auto;gap:8px;align-items:center;margin-top:8px}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 0;display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.catlist .c{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.catlist .c.sub{padding-left:26px}
.catlist .c .n{flex:1}
.studio-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
canvas#post{width:100%;max-width:480px;border-radius:12px;box-shadow:var(--shadow);display:block}
#qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.burger{display:none}
.auth{max-width:380px;margin:10vh auto;padding:0 16px}
.auth .card{padding:24px}
.auth h1{margin-bottom:6px}
.msg{color:var(--danger);min-height:1.2em;margin-top:10px;font-size:13px}
#syncStatus{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}
td a.ed{display:inline-block;min-width:180px}
@media (max-width:1150px){.designer{grid-template-columns:1fr}.stage{position:static}}
@media (max-width:900px){
  .side{position:fixed;left:-240px;top:0;height:100vh;z-index:40;transition:.2s}
  .side.open{left:0}
  .burger{display:inline-flex}
  main{padding:16px}
  .designer,.prodform,.studio-grid,.grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .blocklib{grid-template-columns:1fr}
  .phone{height:620px}
  .tablewrap{overflow-x:auto}
}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="js/shared.js"></script>
</head>
<body>
<div class="banner"><button class="btn sm burger" aria-label="Menú" data-act="menu">☰</button><span>Panel de FlowyMarket</span> <span id="syncStatus"></span><b><button class="btn sm" id="themeBtn">◐ Tema</button></b></div>

<section class="auth" id="login" hidden>
  <div class="card"><h1>Iniciar sesión</h1><p class="hint">Solo para administradores de la tienda.</p>
    <form id="loginForm">
      <label class="f" for="lemail">Correo</label><input type="email" id="lemail" autocomplete="username" required maxlength="160">
      <label class="f" for="lpass">Contraseña</label><input type="password" id="lpass" autocomplete="current-password" required maxlength="128">
      <div class="row" style="margin-top:16px"><button class="btn primary" id="loginBtn" type="submit">Entrar</button><a href="#" id="forgot">¿Olvidaste tu contraseña?</a></div>
      <p class="msg" id="loginMsg" role="alert"></p>
    </form></div>
</section>
<section class="auth" id="newPass" hidden>
  <div class="card"><h1>Nueva contraseña</h1>
    <form id="newPassForm"><label class="f" for="npass">Contraseña nueva (mínimo 10 caracteres)</label><input type="password" id="npass" autocomplete="new-password" required minlength="10" maxlength="128">
      <div class="row" style="margin-top:16px"><button class="btn primary" type="submit">Guardar</button></div><p class="msg" id="newPassMsg" role="alert"></p></form></div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="store"><div class="logo" id="sideLogo"></div><b id="sideName"></b></div>
    <nav id="nav"></nav>
    <div class="foot"><button class="btn sm" style="flex:1" data-act="open-store">Ver tienda</button><button class="btn sm" title="Cerrar sesión" aria-label="Cerrar sesión" data-act="logout">⎋</button></div>
  </aside>
  <main id="view"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/admin.js"></script>
</body>
</html>
